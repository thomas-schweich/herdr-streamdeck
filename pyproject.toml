[project]
name = "herdr-streamdeck"
version = "0.1.0"
description = "Drive an Elgato Stream Deck from herdr's socket API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Thomas Schweich", email = "thomas.schweich@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pillow>=12.3.0",
    "streamdeck>=0.9.8",
]

[project.scripts]
herdr-streamdeck = "herdr_streamdeck.daemon:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

# StreamDeck is annotated but ships no py.typed marker, so mypy cannot see its
# types. This silences the missing-stubs error for that import only; it does
# not relax checking of our own code. deck.DeckDevice restates the device API
# as a Protocol so the boundary stays strictly typed. (PIL ships py.typed and
# needs no override.)
[[tool.mypy.overrides]]
module = ["StreamDeck.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
